[workspace]
members = [
    "programs/*",
    "tests-rs",
]
resolver = "2"

# solana-verify otherwise derives its Docker image from the solana crates in
# Cargo.lock, so a lock bump would silently change the image and the bytes.
[workspace.metadata.cli]
solana = "3.0.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
